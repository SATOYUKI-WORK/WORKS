    /* ── リセット & CSS変数 ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:         #100810;
      --bg2:        #1a0e1a;
      --bg3:        #221525;
      --pink:       #ff6eb4;
      --pink-dim:   rgba(255,110,180,0.45);
      --pink-faint: rgba(255,110,180,0.08);
      --lavender:   #c084fc;
      --text:       #d8b0cc;
      --text-hi:    #f8d8f0;
      --text-dim:   #704060;
      --border:     #3a1a38;
      --border-hi:  #5a2a55;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Courier New', Courier, monospace;
      min-height: 100vh;
      background-image: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(255,110,180,0.012) 2px,
        rgba(255,110,180,0.012) 4px
      );
    }

    /* 背景グロー */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 100% 50% at 50% -5%, rgba(255,110,180,0.08) 0%, transparent 70%),
        radial-gradient(ellipse 50% 50% at 90% 90%,  rgba(192,132,252,0.06) 0%, transparent 60%);
      pointer-events: none;
      z-index: 0;
    }

    /* ── ヘッダー ── */
    header {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 4rem 1rem 2.5rem;
      border-bottom: 1px solid var(--border);
    }

    .logo-prefix {
      font-size: 0.65rem;
      letter-spacing: 0.5em;
      color: var(--text-dim);
      text-transform: uppercase;
      margin-bottom: 0.5rem;
    }

    .site-title {
      font-size: clamp(2.2rem, 7vw, 4.5rem);
      font-weight: 700;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--pink);
      text-shadow:
        0 0 6px var(--pink),
        0 0 20px var(--pink-dim),
        0 0 60px rgba(255,110,180,0.15);
      animation: glitch 9s infinite;
    }

    @keyframes glitch {
      0%,93%,100% { clip-path: none; transform: none; color: var(--pink); }
      94% {
        clip-path: polygon(0 15%, 100% 15%, 100% 38%, 0 38%);
        transform: translate(-4px, 1px);
        color: var(--lavender);
        text-shadow: 0 0 6px var(--lavender), 0 0 20px rgba(192,132,252,0.5);
      }
      95.5% {
        clip-path: polygon(0 60%, 100% 60%, 100% 82%, 0 82%);
        transform: translate(4px, -1px);
        color: var(--pink);
      }
      96% { clip-path: none; transform: none; }
    }

    .site-sub {
      margin-top: 0.6rem;
      font-size: 0.7rem;
      letter-spacing: 0.45em;
      color: var(--text-dim);
      text-transform: uppercase;
    }

    /* ── メインコンテナ ── */
    main {
      position: relative;
      z-index: 1;
      max-width: 900px;
      margin: 0 auto;
      padding: 2.5rem 1rem 6rem;
    }

    /* ステータスバー */
    .status-bar {
      display: flex;
      align-items: center;
      gap: 1.5rem;
      margin-bottom: 1.5rem;
      font-size: 0.65rem;
      letter-spacing: 0.3em;
      color: var(--text-dim);
      text-transform: uppercase;
    }

    .status-bar .val { color: var(--pink); }

    .sep { flex: 1; height: 1px; background: var(--border); }

    /* ── 検索ボックス ── */
    .search-wrap {
      margin-bottom: 1.5rem;
      position: relative;
    }

    .search-wrap::before {
      content: '♪';
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--pink);
      font-size: 0.85rem;
      pointer-events: none;
    }

    #searchInput {
      width: 100%;
      background: var(--bg2);
      border: 1px solid var(--border);
      color: var(--text-hi);
      font-family: inherit;
      font-size: 0.85rem;
      letter-spacing: 0.08em;
      padding: 0.65rem 1rem 0.65rem 2rem;
      outline: none;
      transition: border-color 0.2s;
    }

    #searchInput::placeholder { color: var(--text-dim); }
    #searchInput:focus { border-color: var(--pink-dim); }

    /* ── トラックリスト ── */
    .track-list { display: flex; flex-direction: column; gap: 2px; }

    .track-group {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-left: 3px solid transparent;
      transition: border-color 0.15s, background 0.15s;
    }

    .track-group:hover { border-color: var(--border-hi); }

    .track-group.is-active,
    .track-group.is-open {
      border-left-color: var(--pink);
      background: var(--bg3);
      border-color: var(--border-hi);
    }

    /* トラックヘッダー */
    .track-header {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 0.85rem 1.2rem;
      cursor: pointer;
      user-select: none;
    }

    .track-num {
      font-size: 0.6rem;
      color: var(--text-dim);
      min-width: 2ch;
      text-align: right;
      flex-shrink: 0;
    }

    /* サムネイル */
    .track-thumb {
      width: 46px;
      height: 46px;
      flex-shrink: 0;
      background: var(--bg3);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    .track-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .track-thumb::after {
      content: '♡';
      position: absolute;
      font-size: 1rem;
      color: var(--text-dim);
      pointer-events: none;
    }

    .track-thumb.loaded::after { display: none; }

    .track-name {
      flex: 1;
      font-size: 0.9rem;
      letter-spacing: 0.05em;
      color: var(--text-hi);
      transition: color 0.15s, text-shadow 0.15s;
    }

    .track-group.is-active .track-name,
    .track-group.is-open .track-name {
      color: var(--pink);
      text-shadow: 0 0 12px var(--pink-dim);
    }

    .expand-arrow {
      font-size: 0.6rem;
      color: var(--text-dim);
      transition: transform 0.2s;
      flex-shrink: 0;
    }

    .track-group.is-open .expand-arrow { transform: rotate(180deg); }

    /* ── プレイヤーパネル（展開時） ── */
    .player-panel {
      display: none;
      align-items: flex-start;
      gap: 1.2rem;
      padding: 0 1.2rem 1rem 3.2rem;
    }

    .track-group.is-open .player-panel { display: flex; }

    /* 展開パネル内アートワーク */
    .panel-artwork {
      display: none;
      width: 120px;
      height: 120px;
      flex-shrink: 0;
      background: var(--bg3);
      border: 1px solid var(--border);
      overflow: hidden;
      align-self: flex-start;
      position: relative;
    }

    .panel-artwork img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .panel-artwork::after {
      content: '♡';
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      color: var(--text-dim);
    }

    .panel-artwork.loaded::after { display: none; }
    .panel-artwork.has-art { display: block; }

    /* HTML5 audioプレイヤー */
    audio {
      width: 100%;
      height: 26px;
      outline: none;
      color-scheme: dark;
      filter: hue-rotate(300deg) saturate(1.5) brightness(0.88);
    }

    .audio-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 0.8rem;

      border-top: 1px solid var(--border);
      padding-top: 0.8rem;
      font-size: 0.82rem;
      line-height: 2;
      color: var(--text);
      max-height: 260px;
      overflow-y: auto;

    .lyrics-block.has-lyrics { display: block; }

    /* セクションラベル（[Chorus] など） */
    .lyrics-section {
      font-size: 0.6rem;
      letter-spacing: 0.3em;
      color: var(--pink);
      margin-top: 0.9rem;
      margin-bottom: 0.1rem;

    /* 空行スペーサー */

    /* ── NOW PLAYINGバー（画面下部固定） ── */

      position: fixed;
      bottom: 0; left: 0; right: 0;
      z-index: 200;
      background: rgba(16,8,16,0.96);
      border-top: 1px solid var(--pink-dim);
      padding: 0.6rem 1.5rem;
      display: none;
      align-items: center;
      gap: 1rem;
      backdrop-filter: blur(10px);
      box-shadow: 0 -4px 40px rgba(255,110,180,0.08);
    }

    .now-playing.visible { display: flex; }

    .np-pulse {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--pink);
      box-shadow: 0 0 8px var(--pink), 0 0 20px var(--pink-dim);
      flex-shrink: 0;
      animation: blink 1.1s ease-in-out infinite;
    }

    @keyframes blink {
      0%,100% { opacity: 1; }
      50%      { opacity: 0.25; }
    }

    .np-tag {
      font-size: 0.6rem;
      letter-spacing: 0.35em;
      color: var(--text-dim);
      text-transform: uppercase;
      flex-shrink: 0;
    }

    .np-name {
      font-size: 0.8rem;
      letter-spacing: 0.05em;
      color: var(--pink);
      text-shadow: 0 0 10px var(--pink-dim);
    }

    /* ── フッター ── */
    footer {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 1rem;
      font-size: 0.6rem;
      letter-spacing: 0.35em;
      color: var(--text-dim);
      border-top: 1px solid var(--border);
      text-transform: uppercase;
    }

    /* ── ジャンルセクション ── */
    .genre-section { margin-top: 2.2rem; }
    .genre-section:first-child { margin-top: 0; }

    .genre-header {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      margin-bottom: 0.5rem;
      font-size: 0.6rem;
      letter-spacing: 0.45em;
      color: var(--pink);
      text-transform: uppercase;

    .genre-header .gh-line { flex: 1; height: 1px; background: var(--border); }
    .genre-header .gh-count{ color: var(--text-dim); flex-shrink: 0; }

    /* ── スクロールバー ── */
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border-hi); }
  </style>
</head>

      audio.preload = "none";

      // 再生開始時の処理
      audio.addEventListener("play", () => {
        if (currentAudio && currentAudio !== audio) {
          currentAudio.pause();
          currentAudio.currentTime = 0;
        }
        currentAudio = audio;

        document.querySelectorAll(".track-group").forEach(g => g.classList.remove("is-active"));
        group.classList.add("is-active");

        elNPName.textContent = title;
        elNP.classList.add("visible");
      });

      audio.addEventListener("ended", () => {
        elNP.classList.remove("visible");
        group.classList.remove("is-active");
      });

      audioWrap.appendChild(audio);

      // 歌詞ブロック（初回展開時にフェッチして挿入）
      const lyricsEl = document.createElement("div");
      lyricsEl.className = "lyrics-block";
      audioWrap.appendChild(lyricsEl);

      panel.append(panelArt, audioWrap);

      // アコーディオン開閉（初回展開時に歌詞をフェッチ）
      let lyricsFetched = false;
      header.addEventListener("click", () => {
        const wasOpen = group.classList.contains("is-open");
        document.querySelectorAll(".track-group.is-open").forEach(g => g.classList.remove("is-open"));
        if (!wasOpen) {
          group.classList.add("is-open");
          if (!lyricsFetched) {
            lyricsFetched = true;
            const text = lyricsData[title];
            if (text) {
              lyricsEl.innerHTML = renderLyrics(text);
              lyricsEl.classList.add("has-lyrics");
            }
          }
        }
      });

      group.append(header, panel);
      trackListEl.appendChild(group);
      groups.push({ el: group, titleLower: title.toLowerCase(), genreDir: genre.dir });

      // アートワーク（artwork/タイトル.jpg）
      const artSrc = `artwork/${title}.jpg`;

      const thumbImg = document.createElement("img");
      thumbImg.alt = title;
      thumbImg.onload  = () => thumb.classList.add("loaded");
      thumbImg.onerror = () => {};
      thumbImg.src = artSrc;
      thumb.appendChild(thumbImg);

      const panelImg = document.createElement("img");
      panelImg.alt = title;
      panelImg.onload  = () => { panelArt.classList.add("loaded", "has-art"); };
      panelImg.onerror = () => {};
      panelImg.src = artSrc;
      panelArt.appendChild(panelImg);
    });

    elList.appendChild(section);
  });

  updateVisible();

  // ── 検索フィルタ ──
  elSearch.addEventListener("input", () => {
    const q = elSearch.value.trim().toLowerCase();
    groups.forEach(({ el, titleLower }) => {
      el.style.display = titleLower.includes(q) ? "" : "none";
    });
    // 全曲が非表示のジャンルセクションを隠す
    genres.forEach(genre => {
      const anyVisible = groups
        .filter(g => g.genreDir === genre.dir)
        .some(g => g.el.style.display !== "none");
      genre.sectionEl.style.display = anyVisible ? "" : "none";
    });
    updateVisible();
  });

  function updateVisible() {
    const count = groups.filter(({ el }) => el.style.display !== "none").length;
    elVisible.textContent = count;
  }

  // ── 歌詞テキストをHTMLに変換 ──
  function renderLyrics(text) {
    let html = '';
    // Windows 改行 (\r\n) と Mac 改行 (\r) を統一
    text.replace(/\r\n/g, '\n').replace(/\r/g, '\n').split('\n').forEach(line => {
      const trimmed = line.trim();
      if (!trimmed) {
        // 空行
        html += '<div class="lyrics-blank"></div>';
      } else if (/^\[.+\]$/.test(trimmed)) {
        // [Chorus] などのセクションラベル
        html += `<div class="lyrics-section">${trimmed.slice(1, -1)}</div>`;
      } else {
        // 歌詞の行
        html += `<div class="lyrics-line">${trimmed}</div>`;
      }
    });
    return html;
  }
</script>
</body>
</html>
