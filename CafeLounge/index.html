<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CAFÉ LOUNGE</title>

  <!-- OGP：LINE・SNSでシェアしたときのサムネイル設定 -->
  <meta property="og:type"        content="website" />
  <meta property="og:title"       content="Café Lounge" />
  <meta property="og:description" content="カフェで流れるインストゥルメンタル曲一覧" />
  <meta property="og:image"       content="https://tk2-212-15777.vs.sakura.ne.jp/app1/CafeLounge/samune.jpg" />
  <meta property="og:url"         content="https://tk2-212-15777.vs.sakura.ne.jp/app1/CafeLounge/" />
  <meta property="og:site_name"   content="Café Lounge" />

  <!-- Twitter Card（X・Discordなどでも有効） -->
  <meta name="twitter:card"        content="summary_large_image" />
  <meta name="twitter:title"       content="Café Lounge" />
  <meta name="twitter:description" content="カフェで流れるインストゥルメンタル曲一覧" />
  <meta name="twitter:image"       content="https://tk2-212-15777.vs.sakura.ne.jp/app1/CafeLounge/samune.jpg" />

  <style>
    /* ── リセット & CSS変数 ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:           #18110a;
      --bg2:          #221809;
      --bg3:          #2c1e0c;
      --amber:        #c8924a;
      --amber-dim:    rgba(200,146,74,0.45);
      --amber-faint:  rgba(200,146,74,0.08);
      --cream:        #b89060;
      --text:         #c8a870;
      --text-hi:      #e8d4a8;
      --text-dim:     #6b4e28;
      --border:       #3a2810;
      --border-hi:    #5a3c18;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Georgia', 'Times New Roman', serif;
      min-height: 100vh;
      /* 細かいグレイン感 */
      background-image: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 3px,
        rgba(200,146,74,0.008) 3px,
        rgba(200,146,74,0.008) 4px
      );
    }

    /* 背景グロー */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 40% at 50% -5%,  rgba(200,146,74,0.07) 0%, transparent 70%),
        radial-gradient(ellipse 40% 50% at 85% 85%,  rgba(160,100,40,0.05) 0%, transparent 60%),
        radial-gradient(ellipse 30% 30% at 10% 80%,  rgba(180,130,60,0.04) 0%, transparent 60%);
      pointer-events: none;
      z-index: 0;
    }

    /* ── ヘッダー ── */
    header {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 4rem 1rem 2.5rem;
      border-bottom: 1px solid var(--border);
    }

    .logo-prefix {
      font-size: 0.65rem;
      letter-spacing: 0.55em;
      color: var(--text-dim);
      text-transform: uppercase;
      font-family: 'Courier New', monospace;
      margin-bottom: 0.6rem;
    }

    .site-title {
      font-size: clamp(2rem, 7vw, 4rem);
      font-weight: 400;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--amber);
      text-shadow:
        0 0 8px rgba(200,146,74,0.4),
        0 0 30px rgba(200,146,74,0.15);
      font-style: italic;
    }

    .site-sub {
      margin-top: 0.5rem;
      font-size: 0.65rem;
      letter-spacing: 0.5em;
      color: var(--text-dim);
      text-transform: uppercase;
      font-family: 'Courier New', monospace;
    }

    /* ── メインコンテナ ── */
    main {
      position: relative;
      z-index: 1;
      max-width: 860px;
      margin: 0 auto;
      padding: 2.5rem 1rem 6rem;
    }

    /* ステータスバー */
    .status-bar {
      display: flex;
      align-items: center;
      gap: 1.5rem;
      margin-bottom: 1.5rem;
      font-size: 0.62rem;
      letter-spacing: 0.3em;
      color: var(--text-dim);
      text-transform: uppercase;
      font-family: 'Courier New', monospace;
    }

    .status-bar .val { color: var(--amber); }
    .sep { flex: 1; height: 1px; background: var(--border); }

    /* ── 検索ボックス ── */
    .search-wrap {
      margin-bottom: 1.8rem;
      position: relative;
    }

    .search-wrap::before {
      content: '♬';
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--amber);
      font-size: 0.85rem;
      pointer-events: none;
    }

    #searchInput {
      width: 100%;
      background: var(--bg2);
      border: 1px solid var(--border);
      color: var(--text-hi);
      font-family: 'Courier New', monospace;
      font-size: 0.82rem;
      letter-spacing: 0.06em;
      padding: 0.7rem 1rem 0.7rem 2.2rem;
      outline: none;
      transition: border-color 0.2s;
    }

    #searchInput::placeholder { color: var(--text-dim); }
    #searchInput:focus { border-color: var(--amber-dim); }

    /* ── トラックリスト ── */
    .track-list { display: flex; flex-direction: column; gap: 2px; }

    .track-group {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-left: 3px solid transparent;
      transition: border-color 0.15s, background 0.15s;
    }

    .track-group:hover { border-color: var(--border-hi); }

    .track-group.is-active,
    .track-group.is-open {
      border-left-color: var(--amber);
      background: var(--bg3);
      border-color: var(--border-hi);
    }

    /* トラックヘッダー */
    .track-header {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 0.85rem 1.2rem;
      cursor: pointer;
      user-select: none;
    }

    .track-num {
      font-size: 0.6rem;
      color: var(--text-dim);
      min-width: 2ch;
      text-align: right;
      flex-shrink: 0;
      font-family: 'Courier New', monospace;
    }

    /* サムネイル */
    .track-thumb {
      width: 44px;
      height: 44px;
      flex-shrink: 0;
      background: var(--bg3);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    .track-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* 画像未ロード時のプレースホルダーアイコン */
    .track-thumb::after {
      content: '♪';
      position: absolute;
      font-size: 1.1rem;
      color: var(--text-dim);
      pointer-events: none;
    }

    .track-thumb.loaded::after { display: none; }

    /* トラック名エリア */
    .track-info {
      flex: 1;
      display: flex;
      align-items: baseline;
      gap: 0.6rem;
      min-width: 0;
    }

    .track-name {
      font-size: 0.88rem;
      letter-spacing: 0.04em;
      color: var(--text-hi);
      transition: color 0.15s;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-group.is-active .track-name,
    .track-group.is-open .track-name {
      color: var(--amber);
    }

    /* ヘッダー内：バージョン数バッジ */
    .ver-count {
      font-size: 0.58rem;
      letter-spacing: 0.2em;
      color: var(--text-dim);
      flex-shrink: 0;
      font-family: 'Courier New', monospace;
      background: var(--bg);
      border: 1px solid var(--border);
      padding: 0.1em 0.45em;
    }

    /* 展開パネル内：バージョン行 */
    .ver-row {
      display: flex;
      align-items: center;
      gap: 0.7rem;
    }

    .ver-row + .ver-row {
      margin-top: 0.55rem;
      padding-top: 0.55rem;
      border-top: 1px solid var(--border);
    }

    .ver-label {
      font-size: 0.58rem;
      letter-spacing: 0.2em;
      color: var(--text-dim);
      font-family: 'Courier New', monospace;
      flex-shrink: 0;
      min-width: 3.5em;
      text-align: right;
    }

    .ver-row audio {
      flex: 1;
    }

    .expand-arrow {
      font-size: 0.55rem;
      color: var(--text-dim);
      transition: transform 0.2s;
      flex-shrink: 0;
      font-family: 'Courier New', monospace;
    }

    .track-group.is-open .expand-arrow { transform: rotate(180deg); }

    /* ── プレイヤーパネル（展開時） ── */
    .player-panel {
      display: none;
      align-items: flex-start;
      gap: 1.2rem;
      padding: 0 1.2rem 1.1rem 3.8rem;
    }

    .track-group.is-open .player-panel { display: flex; }

    /* 展開パネル内アートワーク */
    .panel-artwork {
      display: none;
      width: 110px;
      height: 110px;
      flex-shrink: 0;
      background: var(--bg3);
      border: 1px solid var(--border);
      overflow: hidden;
      position: relative;
    }

    .panel-artwork img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .panel-artwork::after {
      content: '♪';
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      color: var(--text-dim);
    }

    .panel-artwork.loaded::after { display: none; }
    .panel-artwork.has-art { display: block; }

    /* HTML5 audioプレイヤー */
    .audio-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    audio {
      width: 100%;
      height: 30px;
      outline: none;
      color-scheme: dark;
      filter: hue-rotate(20deg) saturate(1.2) brightness(0.9);
    }

    /* ── ヒントバー ── */
    .hint-bar {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      margin-bottom: 1.8rem;
      padding: 0.55rem 0.9rem;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-left: 3px solid var(--amber-dim);
      font-size: 0.72rem;
      color: var(--text-dim);
      font-family: 'Courier New', monospace;
      letter-spacing: 0.03em;
    }

    .hint-bar strong {
      color: var(--amber);
      font-weight: normal;
    }

    .hint-icon {
      color: var(--amber);
      flex-shrink: 0;
      opacity: 0.7;
    }

    /* ── ムードセクション ── */
    .mood-section { margin-top: 2.5rem; }
    .mood-section:first-child { margin-top: 0; }

    .mood-header {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      margin-bottom: 0.6rem;
      font-size: 0.6rem;
      letter-spacing: 0.45em;
      color: var(--amber);
      text-transform: uppercase;
      font-family: 'Courier New', monospace;
    }

    .mood-header .mh-icon  { font-size: 0.85rem; color: var(--amber); opacity: 0.7; }
    .mood-header .mh-line  { flex: 1; height: 1px; background: var(--border); }
    .mood-header .mh-count { color: var(--text-dim); flex-shrink: 0; }
    .mood-header .mh-desc  {
      font-size: 0.55rem;
      letter-spacing: 0.2em;
      color: var(--text-dim);
      font-style: normal;
    }

    /* PLAY ALL ボタン */
    .mh-play-btn {
      flex-shrink: 0;
      background: none;
      border: 1px solid var(--border);
      color: var(--text-dim);
      font-family: 'Courier New', monospace;
      font-size: 0.55rem;
      letter-spacing: 0.25em;
      padding: 0.2em 0.65em;
      cursor: pointer;
      text-transform: uppercase;
      transition: border-color 0.15s, color 0.15s;
    }

    .mh-play-btn:hover {
      border-color: var(--amber-dim);
      color: var(--amber);
    }

    /* 連続再生中のセクション */
    .mood-section.is-playing .mh-play-btn {
      border-color: var(--amber);
      color: var(--amber);
    }

    .mood-section.is-playing .mh-line {
      background: linear-gradient(to right, var(--amber-dim), var(--border));
    }

    /* ── NOW PLAYINGバー（画面下部固定） ── */
    .now-playing {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      z-index: 200;
      background: rgba(24,17,10,0.96);
      border-top: 1px solid var(--amber-dim);
      padding: 0.65rem 1.5rem;
      display: none;
      align-items: center;
      gap: 1rem;
      backdrop-filter: blur(12px);
      box-shadow: 0 -4px 40px rgba(200,146,74,0.06);
    }

    .now-playing.visible { display: flex; }

    .np-pulse {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--amber);
      box-shadow: 0 0 8px var(--amber), 0 0 20px var(--amber-dim);
      flex-shrink: 0;
      animation: blink 1.4s ease-in-out infinite;
    }

    @keyframes blink {
      0%,100% { opacity: 1; }
      50%      { opacity: 0.2; }
    }

    .np-tag {
      font-size: 0.58rem;
      letter-spacing: 0.4em;
      color: var(--text-dim);
      text-transform: uppercase;
      flex-shrink: 0;
      font-family: 'Courier New', monospace;
    }

    .np-name {
      font-size: 0.82rem;
      letter-spacing: 0.04em;
      color: var(--amber);
      text-shadow: 0 0 12px var(--amber-dim);
      font-style: italic;
    }

    /* ── フッター ── */
    footer {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 1.2rem;
      font-size: 0.58rem;
      letter-spacing: 0.4em;
      color: var(--text-dim);
      border-top: 1px solid var(--border);
      text-transform: uppercase;
      font-family: 'Courier New', monospace;
    }

    /* ── スクロールバー ── */
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border-hi); }
  </style>
</head>
<body>

<header>
  <p class="logo-prefix">— ambient instrumental —</p>
  <h1 class="site-title">Café Lounge</h1>
  <p class="site-sub">lofi sessions · relax & breathe</p>
</header>

<main>
  <div class="status-bar">
    <span>TRACKS: <span class="val" id="totalCount">0</span></span>
    <span>VISIBLE: <span class="val" id="visibleCount">0</span></span>
    <div class="sep"></div>
    <span>INSTRUMENTAL · NO VOCALS</span>
  </div>

  <div class="search-wrap">
    <input
      id="searchInput"
      type="text"
      placeholder="Search tracks..."
      autocomplete="off"
      spellcheck="false"
    />
  </div>

  <div class="hint-bar">
    <span class="hint-icon">▷</span>
    各セクションの <strong>Play All</strong> ボタンでセクション内を連続再生。末尾まで再生すると先頭にループします。
  </div>

  <div class="track-list" id="trackList"></div>
</main>

<footer>Café Lounge &nbsp;·&nbsp; Instrumental Music &nbsp;·&nbsp; All Rights Reserved</footer>

<!-- NOW PLAYINGバー -->
<div class="now-playing" id="nowPlaying">
  <span class="np-pulse"></span>
  <span class="np-tag">Now Playing</span>
  <span class="np-name" id="npName">—</span>
</div>

<script>
  // ── ムード別曲定義 ──
  // songs: 曲タイトル単位でグループ化。versions 内に各バージョンのファイル名を列挙
  const moods = [
    {
      label: "MIDNIGHT HOURS",
      icon:  "☕",
      desc:  "深夜の静寂とコーヒーの香り",
      songs: [
        { displayName: "Midnight Mug Reflections", versions: ["Midnight Mug Reflections1", "Midnight Mug Reflections2"] },
        { displayName: "Midnight Porcelain",        versions: ["Midnight Porcelain1", "Midnight Porcelain2", "Midnight Porcelain3", "Midnight Porcelain4"] },
        { displayName: "Midnight Steam",            versions: ["Midnight Steam1", "Midnight Steam2"] },
        { displayName: "Velvet Steam",              versions: ["Velvet Steam1", "Velvet Steam2"] },
      ]
    },
    {
      label: "SUNLIT MOMENTS",
      icon:  "☀",
      desc:  "陽光が差し込む午後のひととき",
      songs: [
        { displayName: "Coconut Airwaves",      versions: ["Coconut Airwaves1", "Coconut Airwaves2"] },
        { displayName: "Pastel Morning Stroll", versions: ["Pastel Morning Stroll1", "Pastel Morning Stroll2"] },
        { displayName: "Sunlight On The Table", versions: ["Sunlight On The Table1", "Sunlight On The Table2"] },
        { displayName: "Sunlit Steam",          versions: ["Sunlit Steam1", "Sunlit Steam2"] },
        { displayName: "Sunlit Table for One",  versions: ["Sunlit Table for One1", "Sunlit Table for One2"] },
        { displayName: "Sunny Window Brew",     versions: ["Sunny Window Brew1", "Sunny Window Brew2"] },
        { displayName: "Warm Mug Morning",      versions: ["Warm Mug Morning1", "Warm Mug Morning2"] },
      ]
    },
    {
      label: "RAINY AFTERNOONS",
      icon:  "🌧",
      desc:  "窓を叩く雨音とくぐもった光",
      songs: [
        { displayName: "Dust on the Daydream",    versions: ["Dust on the Daydream1", "Dust on the Daydream2"] },
        { displayName: "Faded Polaroids",         versions: ["Faded Polaroids1", "Faded Polaroids2"] },
        { displayName: "Rain on the Window Tape", versions: ["Rain on the Window Tape1", "Rain on the Window Tape2"] },
        { displayName: "Soft October Pages",      versions: ["Soft October Pages1", "Soft October Pages2"] },
        { displayName: "Steam on the Window",     versions: ["Steam on the Window1", "Steam on the Window2"] },
      ]
    },
    {
      label: "COZY CORNERS",
      icon:  "🍵",
      desc:  "温かいカップとゆったりした時間",
      songs: [
        { displayName: "Quiet Cups at 118",      versions: ["Quiet Cups at 118_1", "Quiet Cups at 118_2"] },
        { displayName: "Quiet Cups, Slow Time",  versions: ["Quiet Cups, Slow Time1", "Quiet Cups, Slow Time2"] },
        { displayName: "Snow Mugs & Woolen Hugs",versions: ["Snow Mugs & Woolen Hugs1", "Snow Mugs & Woolen Hugs2"] },
        { displayName: "Steam & Honey",          versions: ["Steam & Honey1", "Steam & Honey2"] },
      ]
    },
  ];

  const elList    = document.getElementById("trackList");
  const elNP      = document.getElementById("nowPlaying");
  const elNPName  = document.getElementById("npName");
  const elTotal   = document.getElementById("totalCount");
  const elVisible = document.getElementById("visibleCount");
  const elSearch  = document.getElementById("searchInput");

  let currentAudio = null;
  // 検索フィルタ用: { el, nameLower, moodLabel }
  let songMeta = [];

  // ── 連続再生の状態管理 ──
  // playlist: [{ audio, songName, verNum, group }, ...]
  // idx: 現在再生中のインデックス（-1 = 停止中）
  const ap = { sectionEl: null, playlist: [], idx: -1, btnEl: null };

  function apStop() {
    if (ap.sectionEl) ap.sectionEl.classList.remove("is-playing");
    if (ap.btnEl) ap.btnEl.textContent = "▷ Play All";
    ap.sectionEl = null; ap.playlist = []; ap.idx = -1; ap.btnEl = null;
  }

  function apPlayAt(idx) {
    if (idx < 0 || idx >= ap.playlist.length) { apStop(); return; }
    ap.idx = idx;
    const { audio, group } = ap.playlist[idx];

    // 他の開いているアコーディオンを閉じて対象を開く
    document.querySelectorAll(".track-group.is-open").forEach(g => g.classList.remove("is-open"));
    group.classList.add("is-open");
    group.scrollIntoView({ behavior: "smooth", block: "nearest" });

    audio.currentTime = 0;
    audio.play();
  }

  // 総曲数（ユニーク曲タイトル数）を集計
  const totalSongs = moods.reduce((sum, m) => sum + m.songs.length, 0);
  elTotal.textContent = totalSongs;

  let globalIdx = 0;

  // ── ムードセクションごとに生成 ──
  moods.forEach(mood => {
    const section = document.createElement("div");
    section.className = "mood-section";
    mood.sectionEl = section;

    // ムードヘッダー
    const moodHead = document.createElement("div");
    moodHead.className = "mood-header";
    moodHead.innerHTML =
      `<span class="mh-icon">${mood.icon}</span>` +
      `<span>${mood.label}</span>` +
      `<span class="mh-desc">&nbsp;—&nbsp;${mood.desc}</span>` +
      `<span class="mh-line"></span>` +
      `<span class="mh-count">${mood.songs.length} songs</span>`;

    // PLAY ALL ボタン
    const playBtn = document.createElement("button");
    playBtn.className = "mh-play-btn";
    playBtn.textContent = "▷ Play All";
    mood.playBtn = playBtn;
    mood.section = section;

    playBtn.addEventListener("click", () => {
      const alreadyPlaying = ap.sectionEl === section;
      // 現在の連続再生を停止
      if (currentAudio) { currentAudio.pause(); currentAudio.currentTime = 0; }
      apStop();
      if (alreadyPlaying) return; // トグル：同じセクションなら停止だけ

      // このセクションのプレイリストを構築（全song × 全version）
      ap.sectionEl = section;
      ap.btnEl = playBtn;
      ap.playlist = [];
      mood.songs.forEach(song => {
        song.versions.forEach((filename, vi) => {
          ap.playlist.push({
            audio:    song.audios[vi],
            group:    song.groupEl,
            songName: song.displayName,
            verNum:   vi + 1,
          });
        });
      });

      section.classList.add("is-playing");
      playBtn.textContent = "■ Stop";
      apPlayAt(0);
    });

    moodHead.appendChild(playBtn);
    section.appendChild(moodHead);

    const trackListEl = document.createElement("div");
    trackListEl.className = "track-list";
    section.appendChild(trackListEl);

    // ── 曲タイトルごとにグループを生成 ──
    mood.songs.forEach(song => {
      song.audios = []; // 後でプレイリスト構築に使う
      globalIdx++;
      const group = document.createElement("div");
      group.className = "track-group";
      song.groupEl = group; // セクション再生時にアコーディオンを開くために保持

      // ── ヘッダー行 ──
      const header = document.createElement("div");
      header.className = "track-header";

      const numEl = document.createElement("span");
      numEl.className = "track-num";
      numEl.textContent = String(globalIdx).padStart(2, "0");

      // サムネイル
      const thumb = document.createElement("div");
      thumb.className = "track-thumb";
      const thumbImg = document.createElement("img");
      thumbImg.alt = song.displayName;
      thumbImg.onload  = () => thumb.classList.add("loaded");
      thumbImg.onerror = () => {};
      thumbImg.src = `artwork/${song.displayName}.jpg`;
      thumb.appendChild(thumbImg);

      const infoEl = document.createElement("div");
      infoEl.className = "track-info";

      const nameEl = document.createElement("span");
      nameEl.className = "track-name";
      nameEl.textContent = song.displayName;

      const verCountEl = document.createElement("span");
      verCountEl.className = "ver-count";
      verCountEl.textContent = `${song.versions.length} ver.`;

      infoEl.append(nameEl, verCountEl);

      const arrowEl = document.createElement("span");
      arrowEl.className = "expand-arrow";
      arrowEl.innerHTML = "&#9660;";

      header.append(numEl, thumb, infoEl, arrowEl);

      // ── プレイヤーパネル（展開時） ──
      const panel = document.createElement("div");
      panel.className = "player-panel";

      // 展開パネル内アートワーク
      const panelArt = document.createElement("div");
      panelArt.className = "panel-artwork";
      const panelImg = document.createElement("img");
      panelImg.alt = song.displayName;
      panelImg.onload  = () => { panelArt.classList.add("loaded", "has-art"); };
      panelImg.onerror = () => {};
      panelImg.src = `artwork/${song.displayName}.jpg`;
      panelArt.appendChild(panelImg);

      // バージョンリスト
      const audioWrap = document.createElement("div");
      audioWrap.className = "audio-wrap";

      song.versions.forEach((filename, idx) => {
        const verNum = idx + 1;

        const row = document.createElement("div");
        row.className = "ver-row";

        const label = document.createElement("span");
        label.className = "ver-label";
        label.textContent = `ver.${verNum}`;

        const audio = document.createElement("audio");
        audio.src = `music/${filename}.mp3`;
        audio.controls = true;
        audio.preload = "none";

        audio.addEventListener("play", () => {
          if (currentAudio && currentAudio !== audio) {
            currentAudio.pause();
            currentAudio.currentTime = 0;
          }
          currentAudio = audio;
          // 連続再生中でない曲を手動再生した場合は連続再生を解除
          if (ap.sectionEl && (ap.idx < 0 || ap.playlist[ap.idx]?.audio !== audio)) {
            apStop();
          }
          document.querySelectorAll(".track-group").forEach(g => g.classList.remove("is-active"));
          group.classList.add("is-active");
          elNPName.textContent = `${song.displayName}  ·  ver.${verNum}`;
          elNP.classList.add("visible");
        });

        audio.addEventListener("ended", () => {
          group.classList.remove("is-active");
          // 連続再生中なら次へ（末尾なら先頭にループ）
          if (ap.sectionEl) {
            const next = ap.idx + 1;
            apPlayAt(next < ap.playlist.length ? next : 0);
          } else {
            elNP.classList.remove("visible");
          }
        });

        song.audios.push(audio); // プレイリスト構築用に保持
        row.append(label, audio);
        audioWrap.appendChild(row);
      });

      panel.append(panelArt, audioWrap);

      // アコーディオン開閉
      header.addEventListener("click", () => {
        const wasOpen = group.classList.contains("is-open");
        document.querySelectorAll(".track-group.is-open").forEach(g => g.classList.remove("is-open"));
        if (!wasOpen) {
          group.classList.add("is-open");
        }
      });

      group.append(header, panel);
      trackListEl.appendChild(group);
      songMeta.push({
        el: group,
        nameLower: song.displayName.toLowerCase(),
        moodLabel: mood.label,
      });
    });

    elList.appendChild(section);
  });

  updateVisible();

  // ── 検索フィルタ ──
  elSearch.addEventListener("input", () => {
    const q = elSearch.value.trim().toLowerCase();
    songMeta.forEach(({ el, nameLower }) => {
      el.style.display = nameLower.includes(q) ? "" : "none";
    });
    // 全曲が非表示のムードセクションを隠す
    moods.forEach(mood => {
      const anyVisible = songMeta
        .filter(m => m.moodLabel === mood.label)
        .some(m => m.el.style.display !== "none");
      mood.sectionEl.style.display = anyVisible ? "" : "none";
    });
    updateVisible();
  });

  function updateVisible() {
    const count = songMeta.filter(({ el }) => el.style.display !== "none").length;
    elVisible.textContent = count;
  }
</script>
</body>
</html>
