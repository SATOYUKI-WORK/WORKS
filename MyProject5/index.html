<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CYBER TRACKS</title>

  <!-- OGP：LINE・SNSでシェアしたときのサムネイル設定 -->
  <!-- ★ https://tk2-212-15777.vs.sakura.ne.jp/app1/MyProject5/ の部分を実際のURLに変更してください ★ -->
  <meta property="og:type"        content="website" />
  <meta property="og:title"       content="CYBER TRACKS" />
  <meta property="og:description" content="サイバー系トラック集" />
  <meta property="og:image"       content="https://tk2-212-15777.vs.sakura.ne.jp/app1/MyProject5/samune.png" />
  <meta property="og:url"         content="https://tk2-212-15777.vs.sakura.ne.jp/app1/MyProject5/" />
  <meta property="og:site_name"   content="CYBER TRACKS" />

  <!-- Twitter Card（X・Discordなどでも有効） -->
  <meta name="twitter:card"        content="summary_large_image" />
  <meta name="twitter:title"       content="CYBER TRACKS" />
  <meta name="twitter:description" content="サイバー系トラック集" />
  <meta name="twitter:image"       content="https://tk2-212-15777.vs.sakura.ne.jp/app1/MyProject5/samune.png" />
  <style>
    /* ── リセット & CSS変数 ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:         #040810;
      --bg2:        #080e1a;
      --bg3:        #0c1525;
      --cyan:       #00ffe5;
      --cyan-dim:   rgba(0,255,229,0.45);
      --cyan-faint: rgba(0,255,229,0.08);
      --magenta:    #ff00c8;
      --green:      #00ff88;
      --text:       #9fbdd8;
      --text-hi:    #d0e8f8;
      --text-dim:   #3a5870;
      --border:     #0e2840;
      --border-hi:  #1a4060;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Courier New', Courier, monospace;
      min-height: 100vh;
      /* スキャンライン */
      background-image: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0,255,229,0.012) 2px,
        rgba(0,255,229,0.012) 4px
      );
    }

    /* 背景グロー */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 100% 50% at 50% -5%, rgba(0,255,229,0.06) 0%, transparent 70%),
        radial-gradient(ellipse 50% 50% at 90% 90%,  rgba(255,0,200,0.04) 0%, transparent 60%);
      pointer-events: none;
      z-index: 0;
    }

    /* ── ヘッダー ── */
    header {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 4rem 1rem 2.5rem;
      border-bottom: 1px solid var(--border);
    }

    .logo-prefix {
      font-size: 0.65rem;
      letter-spacing: 0.5em;
      color: var(--text-dim);
      text-transform: uppercase;
      margin-bottom: 0.5rem;
    }

    .site-title {
      font-size: clamp(2.2rem, 7vw, 4.5rem);
      font-weight: 700;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--cyan);
      text-shadow:
        0 0 6px var(--cyan),
        0 0 20px var(--cyan-dim),
        0 0 60px rgba(0,255,229,0.15);
      animation: glitch 9s infinite;
    }

    @keyframes glitch {
      0%,93%,100% { clip-path: none; transform: none; color: var(--cyan); }
      94% {
        clip-path: polygon(0 15%, 100% 15%, 100% 38%, 0 38%);
        transform: translate(-4px, 1px);
        color: var(--magenta);
        text-shadow: 0 0 6px var(--magenta), 0 0 20px rgba(255,0,200,0.5);
      }
      95.5% {
        clip-path: polygon(0 60%, 100% 60%, 100% 82%, 0 82%);
        transform: translate(4px, -1px);
        color: var(--cyan);
      }
      96% { clip-path: none; transform: none; }
    }

    .site-sub {
      margin-top: 0.6rem;
      font-size: 0.7rem;
      letter-spacing: 0.45em;
      color: var(--text-dim);
      text-transform: uppercase;
    }

    /* ── メインコンテナ ── */
    main {
      position: relative;
      z-index: 1;
      max-width: 900px;
      margin: 0 auto;
      padding: 2.5rem 1rem 6rem;
    }

    /* ステータスバー */
    .status-bar {
      display: flex;
      align-items: center;
      gap: 1.5rem;
      margin-bottom: 1.5rem;
      font-size: 0.65rem;
      letter-spacing: 0.3em;
      color: var(--text-dim);
      text-transform: uppercase;
    }

    .status-bar .val { color: var(--cyan); }

    /* セパレータ */
    .sep {
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    /* ── 検索ボックス ── */
    .search-wrap {
      margin-bottom: 1.5rem;
      position: relative;
    }

    .search-wrap::before {
      content: '>';
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--cyan);
      font-size: 0.85rem;
      pointer-events: none;
    }

    #searchInput {
      width: 100%;
      background: var(--bg2);
      border: 1px solid var(--border);
      color: var(--text-hi);
      font-family: inherit;
      font-size: 0.85rem;
      letter-spacing: 0.08em;
      padding: 0.65rem 1rem 0.65rem 2rem;
      outline: none;
      transition: border-color 0.2s;
    }

    #searchInput::placeholder { color: var(--text-dim); }
    #searchInput:focus { border-color: var(--cyan-dim); }

    /* ── トラックリスト ── */
    .track-list { display: flex; flex-direction: column; gap: 2px; }

    .track-group {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-left: 3px solid transparent;
      transition: border-color 0.15s, background 0.15s;
    }

    .track-group:hover { border-color: var(--border-hi); }

    .track-group.is-active,
    .track-group.is-open {
      border-left-color: var(--cyan);
      background: var(--bg3);
      border-color: var(--border-hi);
    }

    /* グループヘッダー */
    .track-header {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 0.85rem 1.2rem;
      cursor: pointer;
      user-select: none;
    }

    .track-num {
      font-size: 0.6rem;
      color: var(--text-dim);
      min-width: 2ch;
      text-align: right;
      flex-shrink: 0;
    }

    .track-name {
      flex: 1;
      font-size: 0.9rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-hi);
      transition: color 0.15s, text-shadow 0.15s;
    }

    .track-group.is-active .track-name,
    .track-group.is-open .track-name {
      color: var(--cyan);
      text-shadow: 0 0 12px var(--cyan-dim);
    }

    .ver-count {
      font-size: 0.6rem;
      letter-spacing: 0.15em;
      color: var(--text-dim);
      border: 1px solid var(--border);
      padding: 0.1rem 0.45rem;
      flex-shrink: 0;
    }

    .expand-arrow {
      font-size: 0.6rem;
      color: var(--text-dim);
      transition: transform 0.2s;
      flex-shrink: 0;
    }

    .track-group.is-open .expand-arrow { transform: rotate(180deg); }

    .track-group.is-open .version-panel { display: flex; }

    .ver-row {
      display: flex;
      align-items: center;
      gap: 0.8rem;
    }

    .ver-label {
      font-size: 0.6rem;
      letter-spacing: 0.2em;
      color: var(--text-dim);
      text-transform: uppercase;
      min-width: 5rem;
      flex-shrink: 0;
    }

    /* HTML5 audioプレイヤー */
    audio {
      width: 100%;
      height: 26px;
      outline: none;
      color-scheme: dark;
      /* シアン寄りのカラーリングに */
      filter: hue-rotate(168deg) saturate(1.5) brightness(0.88);
    }

    /* ── NOW PLAYINGバー（画面下部固定） ── */
    .now-playing {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      z-index: 200;
      background: rgba(4,8,16,0.96);
      border-top: 1px solid var(--cyan-dim);
      padding: 0.6rem 1.5rem;
      display: none;
      align-items: center;
      gap: 1rem;
      backdrop-filter: blur(10px);
      box-shadow: 0 -4px 40px rgba(0,255,229,0.08);
    }

    .now-playing.visible { display: flex; }

    .np-pulse {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 8px var(--cyan), 0 0 20px var(--cyan-dim);
      flex-shrink: 0;
      animation: blink 1.1s ease-in-out infinite;
    }

    @keyframes blink {
      0%,100% { opacity: 1; }
      50%      { opacity: 0.25; }
    }

    .np-tag {
      font-size: 0.6rem;
      letter-spacing: 0.35em;
      color: var(--text-dim);
      text-transform: uppercase;
      flex-shrink: 0;
    }

    .np-name {
      font-size: 0.8rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--cyan);
      text-shadow: 0 0 10px var(--cyan-dim);
    }

    /* ── フッター ── */
    footer {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 1rem;
      font-size: 0.6rem;
      letter-spacing: 0.35em;
      color: var(--text-dim);
      border-top: 1px solid var(--border);
      text-transform: uppercase;
    }

    /* ── アートワーク ── */
    /* ヘッダー内サムネイル */
    .track-thumb {
      width: 46px;
      height: 46px;
      flex-shrink: 0;
      background: var(--bg3);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    .track-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* アートワーク未ロード中のプレースホルダー */
    .track-thumb::after {
      content: '♪';
      position: absolute;
      font-size: 1rem;
      color: var(--text-dim);
      pointer-events: none;
    }

    /* 画像ロード済みは疑似要素を隠す */
    .track-thumb.loaded::after { display: none; }

    /* 展開パネル内の大きいアートワーク */
    .panel-artwork {
      display: none;
      width: 120px;
      height: 120px;
      flex-shrink: 0;
      background: var(--bg3);
      border: 1px solid var(--border);
      overflow: hidden;
      align-self: flex-start;
      position: relative;
    }

    .panel-artwork img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .panel-artwork::after {
      content: '♪';
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      color: var(--text-dim);
    }

    .panel-artwork.loaded::after { display: none; }
    .panel-artwork.has-art { display: block; }

    /* バージョンパネルを横並びレイアウトに（アート + 曲リスト） */
    .version-panel {
      display: none;
      flex-direction: row;   /* 横並び */
      gap: 1.2rem;
      padding: 0 1.2rem 1rem 3.2rem;
      align-items: flex-start;
    }

    .ver-rows {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    /* ── スクロールバー ── */
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border-hi); }
  </style>
</head>
<body>

<header>
  <p class="logo-prefix">// AUDIO ARCHIVE //</p>
  <h1 class="site-title">CYBER TRACKS</h1>
  <p class="site-sub">SYSTEM ONLINE — STREAMING ENABLED</p>
</header>

<main>
  <div class="status-bar">
    <span>TRACKS: <span class="val" id="totalCount">0</span></span>
    <span>VISIBLE: <span class="val" id="visibleCount">0</span></span>
    <div class="sep"></div>
    <span>SYS://MUSIC_DIR</span>
  </div>

  <div class="search-wrap">
    <input
      id="searchInput"
      type="text"
      placeholder="SEARCH TRACKS..."
      autocomplete="off"
      spellcheck="false"
    />
  </div>

  <div class="track-list" id="trackList"></div>
</main>

<footer>SYS://CYBER_TRACKS &nbsp;|&nbsp; ALL RIGHTS RESERVED</footer>

<!-- NOW PLAYINGバー -->
<div class="now-playing" id="nowPlaying">
  <span class="np-pulse"></span>
  <span class="np-tag">NOW PLAYING</span>
  <span class="np-name" id="npName">—</span>
</div>

<script>
  // ── 曲データ（music/ 配下のMP3ファイルに対応） ──
  // バージョン番号（末尾の数字）でグループ化して表示
  const tracks = [
    { title: "Binary Carousel",         versions: [1, 2] },
    { title: "Circuit Break Ritual",    versions: [1, 2] },
    { title: "Clockwork Fracture",      versions: [1, 2] },
    { title: "Concrete Roots Riddim",   versions: [1, 2] },
    { title: "Event Horizon Fracture",  versions: [1, 2] },
    { title: "Glitch In The Basement",  versions: [1, 2] },
    { title: "Midnight Circuit Pursuit",versions: [1, 2] },
    { title: "Midnight Rail Systems",   versions: [1, 2] },
    { title: "Neon Gumbo Circuit",      versions: [1, 2] },
    { title: "Neon Spine",              versions: [1, 2] },
    { title: "Quantum Packet Chase",    versions: [2]    },
    { title: "Steel Cathedral Overload",versions: [1, 2] },
    { title: "Subterranean Amen Run",   versions: [1, 2] },
    { title: "Untitled",                versions: [1]    },
  ];

  const elList    = document.getElementById("trackList");
  const elNP      = document.getElementById("nowPlaying");
  const elNPName  = document.getElementById("npName");
  const elTotal   = document.getElementById("totalCount");
  const elVisible = document.getElementById("visibleCount");
  const elSearch  = document.getElementById("searchInput");

  let currentAudio = null;
  let groups = []; // { el, title } の配列（検索フィルタ用）

  elTotal.textContent = tracks.length;

  // アートワークは artwork/タイトル.jpg として事前抽出済み

  // ── 各トラックグループを生成 ──
  tracks.forEach((track, idx) => {
    const group = document.createElement("div");
    group.className = "track-group";

    // ── サムネイル（ヘッダー用） ──
    const thumb = document.createElement("div");
    thumb.className = "track-thumb";

    // ── ヘッダー ──
    const header = document.createElement("div");
    header.className = "track-header";

    const numEl   = document.createElement("span");
    numEl.className = "track-num";
    numEl.textContent = String(idx + 1).padStart(2, "0");

    const nameEl  = document.createElement("span");
    nameEl.className = "track-name";
    nameEl.textContent = track.title;

    const verEl   = document.createElement("span");
    verEl.className = "ver-count";
    verEl.textContent = `${track.versions.length}VER`;

    const arrowEl = document.createElement("span");
    arrowEl.className = "expand-arrow";
    arrowEl.innerHTML = "&#9660;";

    header.append(thumb, numEl, nameEl, verEl, arrowEl);

    // ── バージョンパネル ──
    const panel = document.createElement("div");
    panel.className = "version-panel";

    // 展開パネル内の大きいアートワーク枠
    const panelArt = document.createElement("div");
    panelArt.className = "panel-artwork";

    // バージョン一覧
    const verRows = document.createElement("div");
    verRows.className = "ver-rows";

    track.versions.forEach(ver => {
      const src = `music/${track.title}${ver}.mp3`;

      const row = document.createElement("div");
      row.className = "ver-row";

      const label = document.createElement("span");
      label.className = "ver-label";
      label.textContent = `VER.${ver}`;

      const audio = document.createElement("audio");
      audio.src = src;
      audio.controls = true;
      audio.preload = "none";

      // 再生開始時の処理
      audio.addEventListener("play", () => {
        if (currentAudio && currentAudio !== audio) {
          currentAudio.pause();
          currentAudio.currentTime = 0;
        }
        currentAudio = audio;

        document.querySelectorAll(".track-group").forEach(g => g.classList.remove("is-active"));
        group.classList.add("is-active");

        elNPName.textContent = `${track.title}  —  VER.${ver}`;
        elNP.classList.add("visible");
      });

      audio.addEventListener("ended", () => {
        elNP.classList.remove("visible");
        group.classList.remove("is-active");
      });

      row.append(label, audio);
      verRows.appendChild(row);
    });

    panel.append(panelArt, verRows);

    // アコーディオン開閉
    header.addEventListener("click", () => {
      const wasOpen = group.classList.contains("is-open");
      document.querySelectorAll(".track-group.is-open").forEach(g => g.classList.remove("is-open"));
      if (!wasOpen) group.classList.add("is-open");
    });

    group.append(header, panel);
    elList.appendChild(group);
    groups.push({ el: group, title: track.title.toLowerCase() });

    // アートワーク画像（artwork/タイトル.jpg）を直接参照
    const artSrc = `artwork/${track.title}.jpg`;

    const thumbImg = document.createElement("img");
    thumbImg.alt = track.title;
    thumbImg.onload  = () => thumb.classList.add("loaded");
    thumbImg.onerror = () => {}; // 画像なしはプレースホルダーのまま
    thumbImg.src = artSrc;
    thumb.appendChild(thumbImg);

    const panelImg = document.createElement("img");
    panelImg.alt = track.title;
    panelImg.onload  = () => { panelArt.classList.add("loaded", "has-art"); };
    panelImg.onerror = () => {};
    panelImg.src = artSrc;
    panelArt.appendChild(panelImg);
  });

  updateVisible();

  // ── 検索フィルタ ──
  elSearch.addEventListener("input", () => {
    const q = elSearch.value.trim().toLowerCase();
    groups.forEach(({ el, title }) => {
      el.style.display = title.includes(q) ? "" : "none";
    });
    updateVisible();
  });

  function updateVisible() {
    const count = groups.filter(({ el }) => el.style.display !== "none").length;
    elVisible.textContent = count;
  }
</script>
</body>
</html>
